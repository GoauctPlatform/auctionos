server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip Compression ────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        application/xml
        font/woff2
        image/svg+xml
        text/css
        text/html
        text/javascript
        text/plain
        text/xml;

    # ── Security Headers (Defense in Depth) ─────────────────────────────────
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header X-Frame-Options           "DENY"             always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # ── SPA entry point — never cache index.html ─────────────────────────────
    # Without this, CDN/browser would cache the old HTML after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        # Re-apply security headers (add_header doesn't inherit inside location blocks)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY"    always;
        try_files $uri =404;
    }

    # ── Hashed assets — cache aggressively (1 year) ──────────────────────────
    # Vite generates content-hashed filenames (e.g. index.a1b2c3d4.js),
    # so it is safe to cache these forever.
    location ~* \.(js|css|woff2?|ttf|otf|eot|ico|png|jpg|jpeg|gif|svg|webp|avif|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── JSON / manifest files ────────────────────────────────────────────────
    location ~* \.(json|webmanifest)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # ── SPA fallback — all routes serve index.html ───────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Error pages ──────────────────────────────────────────────────────────
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
